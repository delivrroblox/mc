services:
  mc:
    image: itzg/minecraft-server
    environment:
      EULA: "true"
      MEMORY: 3G
      TYPE: PAPER
      PLUGINS: |
        https://cdn.modrinth.com/data/UmLGoGij/versions/ATlquwiT/DiscordSRV-Build-1.30.5.jar
        https://cdn.modrinth.com/data/hXiIvTyT/versions/nY6VN1XH/EssentialsX-2.22.0.jar
      VERSION: 1.21.11
      ICON: https://cdn.delivrroblox.net/raw/dqitUh.png
      ENABLE_AUTOSTOP: "TRUE"
      AUTOSTOP_TIMEOUT_EST: "3600"
      ENABLE_WHITELIST: true
      WHITELIST: Bread_dd
    restart: "no"
    ports:
      - "25565:25565"
    volumes:
      - data:/data
    stdin_open: true
    tty: true
    
volumes:
  data: {}
